<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OptiCoupe</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e94560" stroke-width="2">
    <rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="9" y1="4" x2="9" y2="20"/>
  </svg>
  <h1 id="h-title">OptiCoupe</h1>
  <div class="htools">
    <button class="btn-lang active" id="btn-fr" onclick="window.setLang('fr')">FR</button>
    <button class="btn-lang"        id="btn-en" onclick="window.setLang('en')">EN</button>
    <button class="btn btn-sec btn-sm" onclick="window.saveProject()"      id="h-save">💾 Sauvegarder</button>
    <button class="btn btn-sec btn-sm" onclick="window.loadProjectClick()" id="h-load">📂 Ouvrir</button>
    <button class="btn btn-sec btn-sm" onclick="window.exportBonDebit()"   id="h-export" style="display:none">📄 Bon de débit</button>
    <input type="file" id="proj-input" accept=".json" style="display:none" onchange="window.onProjectFile(event)">
  </div>
</header>

<div class="app">
<aside class="sidebar">

  <!-- Projet -->
  <div class="sblock">
    <h2 id="s-projet">Projet</h2>
    <div class="row2">
      <div class="f"><label id="l-projname">Nom du projet</label><input id="proj-name" placeholder="Mon meuble..."></div>
      <div class="f"><label id="l-client">Client</label><input id="proj-client" placeholder="Votre nom"></div>
    </div>
    <div class="row3">
      <div class="f"><label id="l-mat">Matériau</label>
        <select id="proj-mat">
          <option value="Mélaminé">Mélaminé</option><option value="MDF">MDF</option>
          <option value="Contreplaqué">Contreplaqué</option><option value="Aggloméré">Aggloméré</option>
          <option value="OSB">OSB</option><option value="Massif">Massif</option><option value="Autre">Autre</option>
        </select>
      </div>
      <div class="f"><label id="l-thick">Ép. (mm)</label><input type="number" id="proj-thick" value="18" min="1" max="100"></div>
      <div class="f"><label id="l-color">Finition</label><input id="proj-finish" placeholder="Blanc..."></div>
    </div>
    <div class="row2">
      <div class="f">
        <label id="l-mat-desc">Description matériau</label>
        <button class="btn-field" id="btn-mat-desc" onclick="window.openTxtModal('matDesc','proj-mat-desc',window.refreshMatDescBtn)">
          <span id="mat-desc-preview"></span>
        </button>
        <input id="proj-mat-desc" type="hidden" value="">
      </div>
      <div class="f"><label id="l-mat-url">Lien produit (URL)</label><input id="proj-mat-url" type="url" placeholder="https://..."></div>
    </div>
    <div class="f" style="margin-top:4px">
      <label id="l-comments">Commentaires bon de débit</label>
      <button class="btn-field" id="btn-comments" onclick="window.openTxtModal('comments','proj-comments',window.refreshCommentsBtn)">
        <span id="comments-preview"></span>
      </button>
      <input id="proj-comments" type="hidden" value="">
    </div>
  </div>

  <!-- Panneau standard -->
  <div class="sblock">
    <h2 id="s-panel">Panneau standard</h2>
    <div id="presets-wrap" class="presets"></div>
    <div class="add-size">
      <input id="cs-label" placeholder="Nom">
      <input id="cs-w" type="number" placeholder="L mm" min="100">
      <input id="cs-h" type="number" placeholder="H mm" min="100">
      <button class="btn btn-sec btn-sm" onclick="window.addCustomSize()" id="btn-addsize">+</button>
    </div>
    <div class="row2" style="margin-top:9px">
      <div class="f"><label id="l-pw">Largeur (mm)</label><input type="number" id="pW" value="2440" min="100"></div>
      <div class="f"><label id="l-ph">Hauteur (mm)</label><input type="number" id="pH" value="1220" min="100"></div>
    </div>
    <div class="row3">
      <div class="f"><label id="l-kerf">Trait scie (mm)</label><input type="number" id="kerf" value="3" min="0" max="20" step=".5"></div>
      <div class="f" style="grid-column:span 2"><label id="l-area">Surface (m²)</label><input id="pArea" readonly></div>
    </div>
    <label class="toggle-row"><input type="checkbox" id="noRotate"><span id="l-grain">Respecter le fil du bois</span></label>
  </div>

  <!-- Pièces -->
  <div class="sblock" style="flex:1">
    <h2 id="s-pieces">Pièces à découper</h2>
    <div id="piece-err" class="alert alert-err" style="display:none"></div>
    <table class="pt">
      <thead><tr>
        <th></th>
        <th id="th-name">Nom</th><th id="th-l">L mm</th><th id="th-h">H mm</th><th id="th-q">Qté</th>
        <th></th>
      </tr></thead>
      <tbody id="pt-body"></tbody>
    </table>
    <div class="btn-group">
      <button class="btn btn-sec btn-sm" onclick="window.addPiece()"    id="btn-add">+ Pièce</button>
      <button class="btn btn-sec btn-sm" onclick="window.loadExample()" id="btn-ex">Exemple</button>
      <button class="btn btn-sec btn-sm" onclick="window.clearPieces()" id="btn-clear">Vider</button>
    </div>
    <div class="btn-group" style="margin-top:5px">
      <button class="btn btn-sec btn-sm" onclick="window.importDXFClick()" id="btn-dxf-in">⬆ Import DXF</button>
      <button class="btn btn-sec btn-sm" onclick="window.importCSVClick()" id="btn-csv-in">⬆ Import CSV</button>
      <button class="btn btn-sec btn-sm" onclick="window.exportCSV()"      id="btn-csv-out">⬇ Export CSV</button>
      <input type="file" id="dxf-input" accept=".dxf" multiple style="display:none" onchange="window.onDXFFiles(event)">
      <input type="file" id="csv-input" accept=".csv" style="display:none" onchange="window.onCSVFile(event)">
    </div>
  </div>

  <!-- Calculate -->
  <div class="sblock">
    <div id="calc-err" class="alert alert-err" style="display:none"></div>
    <button class="btn btn-primary btn-full" onclick="window.calculate()" id="btn-calc">▶ Optimiser la découpe</button>
  </div>

</aside>

<main class="main" id="main-area">
  <div class="empty" id="empty-state">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
      <rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="9" y1="4" x2="9" y2="20"/>
    </svg>
    <p id="empty-msg">Ajoutez vos pièces et cliquez sur <strong>Optimiser la découpe</strong>.</p>
  </div>
  <div id="results-area" style="display:none;flex-direction:column;min-height:0">
    <div class="tabs" id="tabs"></div>
    <div class="results-wrap" id="results-wrap"></div>
  </div>
</main>
</div>

<div id="tip"></div>

<!-- Textarea modal (material description, comments) -->
<div id="txt-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)window.closeTxtModal()">
  <div class="modal-box">
    <div class="modal-hdr">
      <span id="modal-title"></span>
      <button class="btn btn-sec btn-sm" onclick="window.closeTxtModal()">✕</button>
    </div>
    <textarea id="modal-ta" class="modal-ta" rows="8"></textarea>
    <div style="display:flex;justify-content:flex-end;gap:6px">
      <button class="btn btn-sec btn-sm"     id="modal-cancel" onclick="window.closeTxtModal()">Annuler</button>
      <button class="btn btn-primary btn-sm" id="modal-ok"     onclick="window.saveTxtModal()">OK</button>
    </div>
  </div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
