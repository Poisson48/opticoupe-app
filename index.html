<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OptiCoupe</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#12141a;--s1:#1c1f2b;--s2:#242838;--s3:#2c3147;
  --acc:#e94560;--acc2:#4fc3f7;--green:#4caf50;--orange:#ff9800;
  --txt:#e8eaf0;--dim:#7b8299;--border:#323754;
  --r:8px
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--s1);border-bottom:2px solid var(--acc);padding:8px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0}
header h1{font-size:1rem;font-weight:700;white-space:nowrap}
header .htools{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.app{display:grid;grid-template-columns:330px 1fr;flex:1;overflow:hidden;min-height:0}
.sidebar{background:var(--s1);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.sblock{padding:12px 14px;border-bottom:1px solid var(--border)}
.sblock h2{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--acc);margin-bottom:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:7px}
.row4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;margin-bottom:7px}
.f{display:flex;flex-direction:column;gap:3px}
.f label{font-size:.65rem;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.f input,.f select{background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--txt);padding:5px 7px;font-size:.82rem;width:100%;transition:border-color .15s}
.f input:focus,.f select:focus{outline:none;border-color:var(--acc)}
.f input[readonly]{color:var(--dim)}
.f select option{background:var(--s2)}
.presets{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.preset{background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--dim);padding:2px 6px;font-size:.67rem;cursor:pointer;display:inline-flex;align-items:center;gap:3px;transition:all .15s}
.preset:hover{border-color:var(--acc2);color:var(--txt)}
.preset .x{color:var(--acc);padding:0 2px;font-size:.75rem}
.add-size{display:grid;grid-template-columns:1fr 55px 55px auto;gap:5px;margin-top:6px}
.add-size input{background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--txt);padding:4px 5px;font-size:.72rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:6px 11px;border-radius:var(--r);border:none;font-size:.76rem;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--acc);color:#fff}
.btn-primary:hover{background:#c73652;box-shadow:0 3px 10px rgba(233,69,96,.4)}
.btn-sec{background:var(--s2);border:1px solid var(--border);color:var(--txt)}
.btn-sec:hover{border-color:var(--acc2);color:var(--acc2)}
.btn-sm{padding:3px 7px;font-size:.7rem}
.btn-danger{background:transparent;border:1px solid #c62828;color:#ef5350}
.btn-danger:hover{background:#c62828;color:#fff}
.btn-full{width:100%}
.btn-lang{padding:4px 8px;font-size:.72rem;border-radius:4px;border:1px solid var(--border);background:var(--s2);color:var(--dim);cursor:pointer}
.btn-lang.active{background:var(--acc2);color:#fff;border-color:var(--acc2)}
.btn-group{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.pt{width:100%;border-collapse:collapse;font-size:.75rem;margin-bottom:7px}
.pt th{text-align:left;padding:4px 3px;color:var(--dim);font-size:.65rem;font-weight:600;text-transform:uppercase;border-bottom:1px solid var(--border)}
.pt td{padding:3px 2px;vertical-align:middle}
.pt tr:hover td{background:rgba(255,255,255,.02)}
.pt input{background:var(--bg);border:1px solid var(--border);border-radius:3px;color:var(--txt);padding:3px 4px;font-size:.76rem;width:100%}
.pt input:focus{outline:none;border-color:var(--acc)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.toggle-row{display:flex;align-items:center;gap:7px;font-size:.75rem;color:var(--dim);cursor:pointer;margin-top:5px}
.toggle-row input{accent-color:var(--acc);width:12px;height:12px}
.main{overflow:auto;display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;background:var(--s1);border-bottom:1px solid var(--border);flex-shrink:0;overflow-x:auto}
.tab{padding:8px 14px;font-size:.75rem;font-weight:600;cursor:pointer;color:var(--dim);border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s;display:flex;flex-direction:column;gap:2px}
.tab:hover{color:var(--txt)}
.tab.active{color:var(--acc2);border-bottom-color:var(--acc2)}
.tab .td{font-size:.62rem;font-weight:400;color:var(--dim)}
.tab .tb{font-size:.62rem;background:var(--s3);border-radius:3px;padding:1px 5px;color:var(--txt)}
.results-wrap{padding:14px;flex:1;overflow:auto}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stat{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:9px 13px;min-width:100px}
.stat .v{font-size:1.3rem;font-weight:800}
.stat .l{font-size:.64rem;color:var(--dim);text-transform:uppercase;letter-spacing:.4px;margin-top:1px}
.stat.green .v{color:var(--green)}.stat.orange .v{color:var(--orange)}.stat.red .v{color:var(--acc)}.stat.blue .v{color:var(--acc2)}
.ctrl-bar{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.ctrl-bar .lbl{font-size:.72rem;color:var(--dim)}
.legend{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
.leg-item{display:flex;align-items:center;gap:4px;font-size:.7rem;background:var(--s1);border:1px solid var(--border);border-radius:4px;padding:3px 7px}
.panels{display:flex;flex-wrap:wrap;gap:14px}
.panel-card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:10px}
.panel-card .ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:.72rem;color:var(--dim)}
.panel-card canvas{display:block;border-radius:4px;cursor:default}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;gap:10px;color:var(--dim);padding:40px}
.empty svg{opacity:.2}
.empty p{max-width:260px;line-height:1.6;font-size:.88rem}
.alert{padding:7px 11px;border-radius:var(--r);font-size:.76rem;margin-bottom:9px}
.alert-err{background:rgba(233,69,96,.15);border:1px solid var(--acc);color:#ff8fa0}
#tip{position:fixed;background:rgba(18,20,26,.96);border:1px solid var(--border);border-radius:5px;padding:4px 9px;font-size:.7rem;pointer-events:none;z-index:999;display:none;color:var(--txt)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--acc)}
</style>
</head>
<body>
<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e94560" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
  <h1 id="h-title">OptiCoupe</h1>
  <div class="htools">
    <button class="btn-lang active" id="btn-fr" onclick="setLang('fr')">FR</button>
    <button class="btn-lang" id="btn-en" onclick="setLang('en')">EN</button>
    <button class="btn btn-sec btn-sm" onclick="saveProject()" id="h-save">💾 Sauvegarder</button>
    <button class="btn btn-sec btn-sm" onclick="loadProjectClick()" id="h-load">📂 Ouvrir</button>
    <button class="btn btn-sec btn-sm" onclick="exportBonDebit()" id="h-export" style="display:none">📄 Bon de débit</button>
    <input type="file" id="proj-input" accept=".json" style="display:none" onchange="onProjectFile(event)">
  </div>
</header>

<div class="app">
<aside class="sidebar">

  <div class="sblock">
    <h2 id="s-projet">Projet</h2>
    <div class="row2">
      <div class="f"><label id="l-projname">Nom du projet</label><input id="proj-name" placeholder="Mon meuble..."></div>
      <div class="f"><label id="l-client">Client</label><input id="proj-client" placeholder="Votre nom"></div>
    </div>
    <div class="row3">
      <div class="f"><label id="l-mat">Matériau</label>
        <select id="proj-mat">
          <option>Mélaminé</option><option>MDF</option><option>Contreplaqué</option>
          <option>Aggloméré</option><option>OSB</option><option>Massif</option><option>Autre</option>
        </select>
      </div>
      <div class="f"><label id="l-thick">Ép. (mm)</label><input type="number" id="proj-thick" value="18" min="1" max="100"></div>
      <div class="f"><label id="l-color">Finition</label><input id="proj-finish" placeholder="Blanc..."></div>
    </div>
  </div>

  <div class="sblock">
    <h2 id="s-panel">Panneau standard</h2>
    <div id="presets-wrap" class="presets"></div>
    <div class="add-size">
      <input id="cs-label" placeholder="Nom">
      <input id="cs-w" type="number" placeholder="L mm" min="100">
      <input id="cs-h" type="number" placeholder="H mm" min="100">
      <button class="btn btn-sec btn-sm" onclick="addCustomSize()" id="btn-addsize">+</button>
    </div>
    <div class="row2" style="margin-top:9px">
      <div class="f"><label id="l-pw">Largeur (mm)</label><input type="number" id="pW" value="2440" min="100"></div>
      <div class="f"><label id="l-ph">Hauteur (mm)</label><input type="number" id="pH" value="1220" min="100"></div>
    </div>
    <div class="row3">
      <div class="f"><label id="l-kerf">Trait scie (mm)</label><input type="number" id="kerf" value="3" min="0" max="20" step=".5"></div>
      <div class="f" style="grid-column:span 2"><label id="l-area">Surface (m²)</label><input id="pArea" readonly></div>
    </div>
    <label class="toggle-row"><input type="checkbox" id="noRotate"><span id="l-grain">Respecter le fil du bois (pas de rotation)</span></label>
  </div>

  <div class="sblock" style="flex:1">
    <h2 id="s-pieces">Pièces à découper</h2>
    <div id="piece-err" class="alert alert-err" style="display:none"></div>
    <table class="pt">
      <thead><tr>
        <th></th>
        <th id="th-name">Nom</th>
        <th id="th-l">L mm</th>
        <th id="th-h">H mm</th>
        <th id="th-q">Qté</th>
        <th></th>
      </tr></thead>
      <tbody id="pt-body"></tbody>
    </table>
    <div class="btn-group">
      <button class="btn btn-sec btn-sm" onclick="addPiece()" id="btn-add">+ Pièce</button>
      <button class="btn btn-sec btn-sm" onclick="loadExample()" id="btn-ex">Exemple</button>
      <button class="btn btn-sec btn-sm" onclick="clearPieces()" id="btn-clear">Vider</button>
    </div>
    <div class="btn-group" style="margin-top:5px">
      <button class="btn btn-sec btn-sm" onclick="importCSVClick()" id="btn-csv-in">⬆ Import CSV</button>
      <button class="btn btn-sec btn-sm" onclick="exportCSV()" id="btn-csv-out">⬇ Export CSV</button>
      <input type="file" id="csv-input" accept=".csv" style="display:none" onchange="onCSVFile(event)">
    </div>
  </div>

  <div class="sblock">
    <div id="calc-err" class="alert alert-err" style="display:none"></div>
    <button class="btn btn-primary btn-full" onclick="calculate()" id="btn-calc">▶ Optimiser la découpe</button>
  </div>

</aside>

<main class="main" id="main-area">
  <div class="empty" id="empty-state">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="2" y="4" width="20" height="16" rx="2"/><line x1="2" y1="12" x2="22" y2="12"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
    <p id="empty-msg">Ajoutez vos pièces et cliquez sur <strong>Optimiser la découpe</strong> pour comparer les 4 stratégies.</p>
  </div>
  <div id="results-area" style="display:none;flex-direction:column;min-height:0">
    <div class="tabs" id="tabs"></div>
    <div class="results-wrap" id="results-wrap"></div>
  </div>
</main>
</div>

<div id="tip"></div>

<script>
'use strict';

// ─── i18n ─────────────────────────────────────────────────────────────────────
const T = {
  fr:{
    title:'OptiCoupe',
    projet:'Projet', panel:'Panneau standard', pieces:'Pièces à découper',
    projname:'Nom du projet', client:'Client', mat:'Matériau', thick:'Ép. (mm)', color:'Finition',
    pw:'Largeur (mm)', ph:'Hauteur (mm)', kerf:'Trait scie (mm)', area:'Surface (m²)',
    grain:'Respecter le fil du bois (pas de rotation)',
    thName:'Nom', thL:'L mm', thH:'H mm', thQ:'Qté',
    addPiece:'+ Pièce', example:'Exemple', clear:'Vider',
    csvIn:'⬆ Import CSV', csvOut:'⬇ Export CSV',
    calc:'▶ Optimiser la découpe', save:'💾 Sauvegarder', load:'📂 Ouvrir', export:'📄 Bon de débit',
    emptyMsg:'Ajoutez vos pièces et cliquez sur <strong>Optimiser la découpe</strong> pour comparer les 4 stratégies.',
    addsize:'+',
    a_maxrects:'🎯 Densité max', a_maxrects_d:'MaxRects — minimum de pertes',
    a_llas:'📏 Chutes longues', a_llas_d:'Guillotine — bandes réutilisables',
    a_shelf:'▬ Chutes larges', a_shelf_d:'Par rangées — grandes chutes en bas',
    a_slas:'⚖️ Équilibré', a_slas_d:'Guillotine — bon compromis',
    panels:'panneau(x)', pcs:'pièce(s)', used:'utilisé',
    statPanels:'Panneaux', statEff:'Rendement', statUsed:'Surface utile',
    statWaste:'Chutes / perte', statBig:'+ grande chute',
    showOffcuts:'Afficher les chutes :', hideOffcuts:'✓ Visible', shownOffcuts:'Masqué',
    dragHint:'Glissez les pièces pour ajuster manuellement',
    errBig:'"%(n)s" (%(w)s×%(h)smm) est plus grande que le panneau.',
    errNoPieces:'Ajoutez au moins une pièce avec des dimensions valides.',
    errPanel:'Dimensions du panneau invalides.',
    tipOffcut:'Chute :',
    // Bon de débit
    bonTitle:'BON DE DÉBIT', bonDate:'Date :', bonRef:'Réf. :', bonMat:'Matériau :',
    bonThick:'Épaisseur :', bonPanel:'Panneau :', bonQtyPanels:'Panneaux nécessaires :',
    bonKerf:'Trait de scie :', bonEff:'Rendement global :',
    bonListTitle:'Liste des pièces', bonPlanTitle:'Plans de coupe',
    bonNum:'N°', bonName:'Désignation', bonL:'Longueur', bonW:'Largeur',
    bonThk:'Ép.', bonQty:'Qté', bonObs:'Observations',
    bonPanelLabel:'Panneau', bonScierie:'Document à remettre à votre scierie',
    bonFooter:'Généré par Optimisation Découpe Bois',
  },
  en:{
    title:'OptiCoupe',
    projet:'Project', panel:'Standard Sheet', pieces:'Pieces to cut',
    projname:'Project name', client:'Client', mat:'Material', thick:'Thk (mm)', color:'Finish',
    pw:'Width (mm)', ph:'Height (mm)', kerf:'Blade kerf (mm)', area:'Area (m²)',
    grain:'Respect grain direction (no rotation)',
    thName:'Name', thL:'W mm', thH:'H mm', thQ:'Qty',
    addPiece:'+ Piece', example:'Example', clear:'Clear',
    csvIn:'⬆ Import CSV', csvOut:'⬇ Export CSV',
    calc:'▶ Optimize cutting', save:'💾 Save', load:'📂 Open', export:'📄 Cut Sheet',
    emptyMsg:'Add your pieces and click <strong>Optimize cutting</strong> to compare 4 strategies.',
    addsize:'+',
    a_maxrects:'🎯 Max Density', a_maxrects_d:'MaxRects — minimum waste',
    a_llas:'📏 Long offcuts', a_llas_d:'Guillotine — reusable strips',
    a_shelf:'▬ Wide offcuts', a_shelf_d:'Row-based — large bottom strips',
    a_slas:'⚖️ Balanced', a_slas_d:'Guillotine — good compromise',
    panels:'sheet(s)', pcs:'piece(s)', used:'used',
    statPanels:'Sheets', statEff:'Efficiency', statUsed:'Used area',
    statWaste:'Offcuts / waste', statBig:'Largest offcut',
    showOffcuts:'Show offcuts:', hideOffcuts:'✓ Visible', shownOffcuts:'Hidden',
    dragHint:'Drag pieces to adjust manually',
    errBig:'"%(n)s" (%(w)s×%(h)smm) is larger than the sheet.',
    errNoPieces:'Add at least one piece with valid dimensions.',
    errPanel:'Invalid sheet dimensions.',
    tipOffcut:'Offcut:',
    bonTitle:'CUTTING ORDER', bonDate:'Date:', bonRef:'Ref.:', bonMat:'Material:',
    bonThick:'Thickness:', bonPanel:'Sheet:', bonQtyPanels:'Sheets needed:',
    bonKerf:'Blade kerf:', bonEff:'Overall efficiency:',
    bonListTitle:'Piece list', bonPlanTitle:'Cutting layouts',
    bonNum:'#', bonName:'Description', bonL:'Length', bonW:'Width',
    bonThk:'Thk', bonQty:'Qty', bonObs:'Notes',
    bonPanelLabel:'Sheet', bonScierie:'Document to submit to your cutting service',
    bonFooter:'Generated by Wood Cutting Optimizer',
  }
};
let lang='fr';
const t=k=>T[lang][k]||k;
const fmt=(k,vars)=>t(k).replace(/%\((\w+)\)s/g,(_,n)=>vars[n]??'');

function setLang(l){
  lang=l;
  document.getElementById('btn-fr').className='btn-lang'+(l==='fr'?' active':'');
  document.getElementById('btn-en').className='btn-lang'+(l==='en'?' active':'');
  applyLang();
}
function applyLang(){
  const ids={
    'h-title':'title','h-save':'save','h-load':'load','h-export':'export',
    's-projet':'projet','s-panel':'panel','s-pieces':'pieces',
    'l-projname':'projname','l-client':'client','l-mat':'mat','l-thick':'thick','l-color':'color',
    'l-pw':'pw','l-ph':'ph','l-kerf':'kerf','l-area':'area','l-grain':'grain',
    'th-name':'thName','th-l':'thL','th-h':'thH','th-q':'thQ',
    'btn-add':'addPiece','btn-ex':'example','btn-clear':'clear',
    'btn-csv-in':'csvIn','btn-csv-out':'csvOut','btn-calc':'calc',
    'btn-addsize':'addsize',
  };
  for(const [id,key] of Object.entries(ids)){
    const el=document.getElementById(id);
    if(el) el.textContent=t(key);
  }
  document.getElementById('empty-msg').innerHTML=t('emptyMsg');
  document.documentElement.lang=lang;
  // Re-render dynamic parts if results exist
  if(Object.keys(results).length) renderTabs(cachedPanel.w, cachedPanel.h, cachedPanel.kerf);
  const rw=document.getElementById('results-wrap');
  if(rw.children.length&&Object.keys(results).length)
    renderAlgoResult(activeAlgo, cachedPanel.w, cachedPanel.h, cachedPanel.kerf);
}

// ─── Palette ──────────────────────────────────────────────────────────────────
const PAL=['#e94560','#4fc3f7','#81c784','#ffb74d','#ce93d8','#4dd0e1',
  '#f06292','#aed581','#ff8a65','#90caf9','#80cbc4','#ffe082',
  '#ef9a9a','#b39ddb','#ffcc80','#80deea','#c5e1a5','#ffab91'];

const BUILTIN=[
  {label:'2440×1220',w:2440,h:1220},{label:'2500×1250',w:2500,h:1250},
  {label:'3050×1525',w:3050,h:1525},{label:'2800×2070',w:2800,h:2070},
  {label:'2440×610', w:2440,h:610 },
];

// ─── State ────────────────────────────────────────────────────────────────────
let pieces=[],nextId=1;
let customSizes=JSON.parse(localStorage.getItem('dcb_sizes')||'[]');
let results={}, activeAlgo='maxrects', showOffcuts=true;
let cachedPanel={w:2440,h:1220,kerf:3};

// ─── Custom sizes ─────────────────────────────────────────────────────────────
function saveCustomSizes(){localStorage.setItem('dcb_sizes',JSON.stringify(customSizes));}
function addCustomSize(){
  const label=document.getElementById('cs-label').value.trim();
  const w=parseInt(document.getElementById('cs-w').value);
  const h=parseInt(document.getElementById('cs-h').value);
  if(!w||!h||w<100||h<100) return;
  customSizes.push({label:label||`${w}×${h}`,w,h});
  saveCustomSizes(); renderPresets();
  document.getElementById('cs-label').value='';
  document.getElementById('cs-w').value='';
  document.getElementById('cs-h').value='';
}
function deleteCustomSize(i){customSizes.splice(i,1);saveCustomSizes();renderPresets();}
function applyPreset(w,h){
  document.getElementById('pW').value=w;
  document.getElementById('pH').value=h;
  updateArea();
}
function renderPresets(){
  const c=document.getElementById('presets-wrap');
  c.innerHTML='';
  [...BUILTIN,...customSizes.map((s,i)=>({...s,custom:true,idx:i}))].forEach(p=>{
    const b=document.createElement('button');
    b.className='preset';
    b.onclick=()=>applyPreset(p.w,p.h);
    if(p.custom){
      b.innerHTML=`${p.label}<span class="x" onclick="event.stopPropagation();deleteCustomSize(${p.idx})">✕</span>`;
    } else {
      b.textContent=p.label;
    }
    c.appendChild(b);
  });
}
function updateArea(){
  const w=+document.getElementById('pW').value||0;
  const h=+document.getElementById('pH').value||0;
  document.getElementById('pArea').value=((w*h)/1e6).toFixed(3);
}

// ─── Pieces ───────────────────────────────────────────────────────────────────
function addPiece(name='',w='',h='',qty=1){
  pieces.push({id:nextId++,name,w,h,qty,color:PAL[pieces.length%PAL.length]});
  renderPiecesTable();
}
function removePiece(id){pieces=pieces.filter(p=>p.id!==id);renderPiecesTable();}
function clearPieces(){pieces=[];nextId=1;renderPiecesTable();}
function loadExample(){
  clearPieces();
  [['Fond',800,400,2],['Côté',400,600,4],['Tablette',780,300,3],
   ['Dos',800,600,1],['Façade',820,180,3],['Étagère',600,250,2]
  ].forEach(([n,w,h,q])=>addPiece(n,w,h,q));
}

// ─── Algorithms ───────────────────────────────────────────────────────────────
class GuillotinePacker{
  constructor(W,H,{split='SLAS'}={}){
    this.W=W;this.H=H;this.split=split;
    this.freeRects=[{x:0,y:0,w:W,h:H}];
    this.placements=[];this.usedArea=0;
  }
  insert(item,allowRot){
    let best=null,bs=Infinity,br=false;
    for(const r of this.freeRects){
      if(item.w<=r.w&&item.h<=r.h){const s=Math.min(r.w-item.w,r.h-item.h);if(s<bs){bs=s;best=r;br=false;}}
      if(allowRot&&item.w!==item.h&&item.h<=r.w&&item.w<=r.h){const s=Math.min(r.w-item.h,r.h-item.w);if(s<bs){bs=s;best=r;br=true;}}
    }
    if(!best) return false;
    const pw=br?item.h:item.w,ph=br?item.w:item.h;
    this.placements.push({x:best.x,y:best.y,w:pw,h:ph,piece:item,rotated:br});
    this.usedArea+=pw*ph;
    this._split(best,pw,ph);
    return true;
  }
  _split(r,pw,ph){
    this.freeRects=this.freeRects.filter(x=>x!==r);
    const rw=r.w-pw,bh=r.h-ph;
    const long=(this.split==='LLAS')?rw>bh:rw<bh;
    if(long){
      if(rw>0)this.freeRects.push({x:r.x+pw,y:r.y,w:rw,h:r.h});
      if(bh>0)this.freeRects.push({x:r.x,y:r.y+ph,w:pw,h:bh});
    }else{
      if(bh>0)this.freeRects.push({x:r.x,y:r.y+ph,w:r.w,h:bh});
      if(rw>0)this.freeRects.push({x:r.x+pw,y:r.y,w:rw,h:ph});
    }
    this._prune();
  }
  _prune(){
    this.freeRects=this.freeRects.filter((a,i)=>
      !this.freeRects.some((b,j)=>i!==j&&b.x<=a.x&&b.y<=a.y&&b.x+b.w>=a.x+a.w&&b.y+b.h>=a.y+a.h));
  }
  get efficiency(){return(this.usedArea/(this.W*this.H))*100;}
}

class MaxRectsPacker{
  constructor(W,H){
    this.W=W;this.H=H;
    this.freeRects=[{x:0,y:0,w:W,h:H}];
    this.placements=[];this.usedArea=0;
  }
  insert(item,allowRot){
    let best=null,bs=Infinity,br=false;
    for(const r of this.freeRects){
      if(item.w<=r.w&&item.h<=r.h){const s=Math.min(r.w-item.w,r.h-item.h);if(s<bs){bs=s;best=r;br=false;}}
      if(allowRot&&item.w!==item.h&&item.h<=r.w&&item.w<=r.h){const s=Math.min(r.w-item.h,r.h-item.w);if(s<bs){bs=s;best=r;br=true;}}
    }
    if(!best) return false;
    const pw=br?item.h:item.w,ph=br?item.w:item.h;
    const px=best.x,py=best.y;
    this.placements.push({x:px,y:py,w:pw,h:ph,piece:item,rotated:br});
    this.usedArea+=pw*ph;
    this._split(px,py,pw,ph);
    this._prune();
    return true;
  }
  _split(px,py,pw,ph){
    const add=[],rem=new Set();
    for(let i=0;i<this.freeRects.length;i++){
      const r=this.freeRects[i];
      if(px>=r.x+r.w||px+pw<=r.x||py>=r.y+r.h||py+ph<=r.y) continue;
      rem.add(i);
      if(px>r.x)        add.push({x:r.x,    y:r.y,w:px-r.x,          h:r.h});
      if(px+pw<r.x+r.w) add.push({x:px+pw,  y:r.y,w:r.x+r.w-px-pw,   h:r.h});
      if(py>r.y)         add.push({x:r.x,    y:r.y,w:r.w,             h:py-r.y});
      if(py+ph<r.y+r.h)  add.push({x:r.x,   y:py+ph,w:r.w,           h:r.y+r.h-py-ph});
    }
    this.freeRects=this.freeRects.filter((_,i)=>!rem.has(i));
    this.freeRects.push(...add);
  }
  _prune(){
    this.freeRects=this.freeRects.filter((a,i)=>
      !this.freeRects.some((b,j)=>i!==j&&b.x<=a.x&&b.y<=a.y&&b.x+b.w>=a.x+a.w&&b.y+b.h>=a.y+a.h));
  }
  get efficiency(){return(this.usedArea/(this.W*this.H))*100;}
}

class ShelfPacker{
  constructor(W,H){
    this.W=W;this.H=H;this._shelves=[];this.placements=[];this.usedArea=0;
  }
  insert(item,allowRot){
    const try_=(pw,ph)=>{
      for(const s of this._shelves){
        if(pw<=this.W-s.usedW&&ph<=s.h){
          this.placements.push({x:s.usedW,y:s.y,w:pw,h:ph,piece:item,rotated:pw!==item.w});
          this.usedArea+=pw*ph;s.usedW+=pw;return true;
        }
      }
      const ny=this._shelves.length?this._shelves[this._shelves.length-1].y+this._shelves[this._shelves.length-1].h:0;
      if(ny+ph>this.H||pw>this.W) return false;
      this._shelves.push({y:ny,h:ph,usedW:pw});
      this.placements.push({x:0,y:ny,w:pw,h:ph,piece:item,rotated:pw!==item.w});
      this.usedArea+=pw*ph;return true;
    };
    return try_(item.w,item.h)||(allowRot&&item.w!==item.h&&try_(item.h,item.w));
  }
  get freeRects(){
    const rects=[];
    for(const s of this._shelves)
      if(s.usedW<this.W) rects.push({x:s.usedW,y:s.y,w:this.W-s.usedW,h:s.h});
    const uh=this._shelves.length?this._shelves[this._shelves.length-1].y+this._shelves[this._shelves.length-1].h:0;
    if(uh<this.H) rects.push({x:0,y:uh,w:this.W,h:this.H-uh});
    return rects;
  }
  get efficiency(){return(this.usedArea/(this.W*this.H))*100;}
}

// ─── Algo config ──────────────────────────────────────────────────────────────
const ALGOS={
  maxrects:{lk:'a_maxrects',dk:'a_maxrects_d',Class:MaxRectsPacker,opts:{},sort:'area'},
  llas:    {lk:'a_llas',    dk:'a_llas_d',    Class:GuillotinePacker,opts:{split:'LLAS'},sort:'area'},
  shelf:   {lk:'a_shelf',   dk:'a_shelf_d',   Class:ShelfPacker,opts:{},sort:'height'},
  slas:    {lk:'a_slas',    dk:'a_slas_d',    Class:GuillotinePacker,opts:{split:'SLAS'},sort:'area'},
};

// ─── Packing ──────────────────────────────────────────────────────────────────
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

function runAlgoOnce(items,panelW,panelH,kerf,allowRot,key){
  const{Class,opts}=ALGOS[key];
  const PW=panelW+kerf,PH=panelH+kerf;
  const sheets=[];
  for(const item of items){
    let placed=false;
    for(const s of sheets) if(s.insert(item,allowRot)){placed=true;break;}
    if(!placed){
      const s=new Class(PW,PH,opts);
      if(!s.insert(item,allowRot)) return null; // piece too large
      sheets.push(s);
    }
  }
  return sheets;
}

function runAlgo(pieces,panelW,panelH,kerf,allowRot,key){
  const{sort}=ALGOS[key];
  // Build items list
  const base=[];
  pieces.forEach(p=>{
    for(let i=0;i<p.qty;i++)
      base.push({...p,origW:p.w,origH:p.h,w:p.w+kerf,h:p.h+kerf});
  });
  if(!base.length) return{error:t('errNoPieces')};

  const scored=(sheets)=>sheets
    ? sheets.length*1e9 - sheets.reduce((s,sh)=>s+sh.usedArea,0)
    : Infinity;

  let bestSheets=null,bestScore=Infinity;

  // Attempt 1: canonical sort
  const sorted=[...base];
  if(sort==='height') sorted.sort((a,b)=>b.h-a.h||(b.w*b.h)-(a.w*a.h));
  else sorted.sort((a,b)=>(b.w*b.h)-(a.w*a.h));
  const s0=runAlgoOnce(sorted,panelW,panelH,kerf,allowRot,key);
  if(s0){bestSheets=s0;bestScore=scored(s0);}

  // Restarts with random shuffles (12 attempts — fast for ≤50 pieces)
  if(sort!=='height'){
    for(let t=0;t<12;t++){
      const shuffled=shuffle([...base]);
      const sh=runAlgoOnce(shuffled,panelW,panelH,kerf,allowRot,key);
      const sc=scored(sh);
      if(sc<bestScore){bestScore=sc;bestSheets=sh;}
    }
  }

  if(!bestSheets){
    const p=base[0];
    return{error:fmt('errBig',{n:p.name||'?',w:p.origW,h:p.origH})};
  }
  return{sheets:bestSheets};
}

function calcStats(sheets,panelW,panelH,kerf){
  const pA=(panelW*panelH)/1e6;
  const usedM2=sheets.reduce((s,sh)=>s+sh.usedArea,0)/1e6;
  const totalM2=sheets.length*pA;
  const eff=(usedM2/totalM2*100).toFixed(1);
  let bigW=0,bigH=0;
  sheets.forEach(sh=>(sh.freeRects||[]).forEach(r=>{
    const rw=r.w-kerf,rh=r.h-kerf;
    if(rw>0&&rh>0&&rw*rh>bigW*bigH){bigW=rw;bigH=rh;}
  }));
  return{panels:sheets.length,usedM2:usedM2.toFixed(3),totalM2:totalM2.toFixed(3),
         waste:((totalM2-usedM2)).toFixed(3),eff,bigW:Math.round(bigW),bigH:Math.round(bigH)};
}

// ─── Calculate ────────────────────────────────────────────────────────────────
function calculate(){
  syncPieces();
  document.getElementById('calc-err').style.display='none';
  const panelW=+document.getElementById('pW').value;
  const panelH=+document.getElementById('pH').value;
  const kerf=+document.getElementById('kerf').value||0;
  const allowRot=!document.getElementById('noRotate').checked;
  if(!panelW||!panelH){showErr('calc-err',t('errPanel'));return;}
  const valid=pieces.filter(p=>p.w>0&&p.h>0&&p.qty>0);
  if(!valid.length){showErr('calc-err',t('errNoPieces'));return;}
  cachedPanel={w:panelW,h:panelH,kerf};
  results={};
  let firstErr=null;
  for(const k of Object.keys(ALGOS)){
    const r=runAlgo(valid,panelW,panelH,kerf,allowRot,k);
    if(r.error&&!firstErr) firstErr=r.error;
    results[k]=r;
  }
  if(firstErr&&Object.values(results).every(r=>r.error)){showErr('calc-err',firstErr);return;}
  document.getElementById('empty-state').style.display='none';
  const ra=document.getElementById('results-area');
  ra.style.display='flex'; ra.style.flexDirection='column';
  document.getElementById('h-export').style.display='';
  renderTabs(panelW,panelH,kerf);
  renderAlgoResult(activeAlgo,panelW,panelH,kerf);
}
function showErr(id,msg){const el=document.getElementById(id);el.textContent=msg;el.style.display='block';}

// ─── Tabs ─────────────────────────────────────────────────────────────────────
function renderTabs(panelW,panelH,kerf){
  const tabs=document.getElementById('tabs');
  tabs.innerHTML='';
  for(const[k,a]of Object.entries(ALGOS)){
    const r=results[k];
    const btn=document.createElement('div');
    btn.className='tab'+(k===activeAlgo?' active':'');
    if(r&&!r.error){
      const st=calcStats(r.sheets,panelW,panelH,kerf);
      btn.innerHTML=`<span>${t(a.lk)}</span><span class="td">${t(a.dk)}</span><span class="tb">${st.panels} ${t('panels')} · ${st.eff}%</span>`;
    }else{
      btn.innerHTML=`<span>${t(a.lk)}</span><span class="td">${r?.error?'Erreur':t(a.dk)}</span>`;
    }
    btn.onclick=()=>{
      activeAlgo=k;
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      btn.classList.add('active');
      renderAlgoResult(k,panelW,panelH,kerf);
    };
    tabs.appendChild(btn);
  }
}

// ─── Render result ────────────────────────────────────────────────────────────
function renderAlgoResult(key,panelW,panelH,kerf){

  const st=calcStats(r.sheets,panelW,panelH,kerf);
  const ec=st.eff>=75?'green':st.eff>=50?'orange':'red';
  const big=st.bigW>0?`${st.bigW}×${st.bigH}mm`:'—';

  let html=`<div class="stats">
    <div class="stat red"><div class="v">${st.panels}</div><div class="l">${t('statPanels')}</div></div>
    <div class="stat ${ec}"><div class="v">${st.eff}%</div><div class="l">${t('statEff')}</div></div>
    <div class="stat blue"><div class="v">${st.usedM2} m²</div><div class="l">${t('statUsed')}</div></div>
    <div class="stat orange"><div class="v">${st.waste} m²</div><div class="l">${t('statWaste')}</div></div>
    <div class="stat green"><div class="v">${big}</div><div class="l">${t('statBig')}</div></div>
  </div>`;

  html+=`<div class="ctrl-bar">
    <span class="lbl">${t('showOffcuts')}</span>
    <button class="btn btn-sm ${showOffcuts?'btn-primary':'btn-sec'}" onclick="toggleOffcuts('${key}',${panelW},${panelH},${kerf})">
      ${showOffcuts?t('hideOffcuts'):t('shownOffcuts')}
    </button>
    <span class="lbl" style="margin-left:6px;font-size:.65rem">${t('dragHint')} · ${lang==='fr'?'↻ ou clic droit pour pivoter':'↻ or right-click to rotate'}</span>
  </div>`;

  const seen=new Map();
  r.sheets.forEach(s=>s.placements.forEach(pl=>{if(!seen.has(pl.piece.id))seen.set(pl.piece.id,pl.piece);}));
  html+=`<div class="legend">`+[...seen.values()].map(p=>
    `<div class="leg-item"><span class="dot" style="background:${p.color}"></span>${p.name||'—'} ${p.origW}×${p.origH}mm</div>`
  ).join('')+'</div>';

  html+=`<div class="panels" id="panels-grid"></div>`;
  wrap.innerHTML=html;

  r.sheets.forEach((sheet,i)=>{
    const card=document.createElement('div');
    card.className='panel-card';
    card.innerHTML=`<div class="ph"><span>${t('statPanels')} ${i+1}/${r.sheets.length}</span><span>${sheet.efficiency.toFixed(1)}% · ${sheet.placements.length} ${t('pcs')}</span></div>`;
    const canvas=document.createElement('canvas');
    card.appendChild(canvas);
    document.getElementById('panels-grid').appendChild(card);
    drawPanel(canvas,sheet,panelW,panelH,kerf,null,-1);
    setupDrag(canvas,sheet,panelW,panelH,kerf);
  });
}
function toggleOffcuts(key,panelW,panelH,kerf){
  showOffcuts=!showOffcuts;
  renderAlgoResult(key,panelW,panelH,kerf);
}

// ─── Canvas rendering ─────────────────────────────────────────────────────────
const CM=8;

function panelScale(panelW,panelH){return Math.min(600/panelW,420/panelH);}

// hoverIdx: index of piece under cursor (-1 = none); flashIdx: piece to tint red
function drawPanel(canvas,sheet,panelW,panelH,kerf,drag,hoverIdx=-1,flashIdx=-1){
  const sc=panelScale(panelW,panelH);
  canvas._sc=sc; canvas._panelW=panelW; canvas._panelH=panelH; canvas._kerf=kerf;
  canvas.width=Math.round(panelW*sc)+CM*2;
  canvas.height=Math.round(panelH*sc)+CM*2;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Wood background
  ctx.fillStyle='#c8954a';ctx.strokeStyle='#7a5520';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(CM,CM,panelW*sc,panelH*sc,3);ctx.fill();ctx.stroke();
  ctx.save();ctx.beginPath();ctx.roundRect(CM,CM,panelW*sc,panelH*sc,3);ctx.clip();
  ctx.strokeStyle='rgba(100,60,20,.09)';ctx.lineWidth=1;
  for(let y=CM+10;y<canvas.height-CM;y+=12){ctx.beginPath();ctx.moveTo(CM,y);ctx.lineTo(canvas.width-CM,y);ctx.stroke();}
  ctx.restore();

  // Free rects (offcuts)
  if(showOffcuts&&!sheet._edited){
    const frs=sheet.freeRects;
    (Array.isArray(frs)?frs:[]).forEach(r=>{
      const rx=CM+r.x*sc,ry=CM+r.y*sc;
      const rw=Math.max(0,(r.w-kerf)*sc),rh=Math.max(0,(r.h-kerf)*sc);
      if(rw<2||rh<2) return;
      ctx.save();
      ctx.beginPath();ctx.rect(rx,ry,rw,rh);ctx.clip();
      ctx.fillStyle='rgba(79,195,247,.1)';ctx.fillRect(rx,ry,rw,rh);
      ctx.strokeStyle='rgba(79,195,247,.22)';ctx.lineWidth=1;
      for(let i=-rh;i<rw;i+=9){ctx.beginPath();ctx.moveTo(rx+i,ry);ctx.lineTo(rx+i+rh,ry+rh);ctx.stroke();}
      ctx.strokeStyle='rgba(79,195,247,.5)';ctx.lineWidth=1;
      ctx.beginPath();ctx.rect(rx,ry,rw,rh);ctx.stroke();
      if(rw>55&&rh>22){
        ctx.fillStyle='rgba(79,195,247,.85)';
        ctx.font=`${Math.min(10,rh*.38)}px 'Segoe UI',sans-serif`;
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(`${Math.round(r.w-kerf)}×${Math.round(r.h-kerf)}`,rx+rw/2,ry+rh/2);
      }
      ctx.restore();
    });
  }

  // Pieces
  sheet.placements.forEach((pl,i)=>{
    const isDrag=drag&&drag.idx===i;
    const isFlash=flashIdx===i;
    const pw=Math.max(0,(pl.w-kerf)*sc),ph=Math.max(0,(pl.h-kerf)*sc);
    const px=CM+pl.x*sc,py=CM+pl.y*sc;
    ctx.save();
    if(isDrag) ctx.globalAlpha=drag.valid?0.82:0.55;
    if((isDrag&&!drag.valid)||isFlash){
      ctx.fillStyle='rgba(233,69,96,.55)';ctx.strokeStyle='#e94560';
    } else {
      ctx.fillStyle=pl.piece.color+'bb';ctx.strokeStyle=pl.piece.color;
    }
    ctx.lineWidth=1.5;
    ctx.beginPath();ctx.roundRect(px,py,pw,ph,2);ctx.fill();ctx.stroke();
    // show actual placed dimensions (swapped if rotated)
    const dw=pl.rotated?pl.piece.origH:pl.piece.origW;
    const dh=pl.rotated?pl.piece.origW:pl.piece.origH;
    drawPieceLabel(ctx,px,py,pw,ph,pl.piece.name||'',dw,dh,pl.rotated);
    ctx.restore();
  });

  // Rotate button on hovered piece
  if(hoverIdx>=0&&hoverIdx<sheet.placements.length&&!drag){
    drawRotateBtn(ctx,sheet.placements[hoverIdx],sc,kerf);
  }
}

// Small rotate button drawn in top-right corner of a piece
function drawRotateBtn(ctx,pl,sc,kerf){
  const pw=Math.max(0,(pl.w-kerf)*sc),ph=Math.max(0,(pl.h-kerf)*sc);
  if(pw<36||ph<30) return;
  const bx=CM+pl.x*sc+pw-14, by=CM+pl.y*sc+14;
  ctx.save();
  ctx.fillStyle='rgba(255,255,255,.92)';
  ctx.strokeStyle='rgba(0,0,0,.18)';
  ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(bx,by,10,0,Math.PI*2);ctx.fill();ctx.stroke();
  ctx.fillStyle='#1a1c28';
  ctx.font='bold 13px sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('↻',bx,by+1);
  ctx.restore();
}

// Returns true if (mx,my) in canvas px is over the rotate button of placement pl
function isOverRotBtn(mx,my,pl,sc,kerf){
  const pw=Math.max(0,(pl.w-kerf)*sc),ph=Math.max(0,(pl.h-kerf)*sc);
  if(pw<36||ph<30) return false;
  const bx=CM+pl.x*sc+pw-14, by=CM+pl.y*sc+14;
  return (mx-bx)**2+(my-by)**2<=100;
}

function drawPieceLabel(ctx,px,py,pw,ph,name,dw,dh,rotated){
  if(pw<14||ph<10) return;
  ctx.save();
  ctx.beginPath();ctx.rect(px+2,py+2,pw-4,ph-4);ctx.clip();
  const fs=Math.min(11,ph*0.28,pw*0.14);
  if(fs<5.5){ctx.restore();return;}
  ctx.textAlign='center';ctx.textBaseline='middle';
  const cx=px+pw/2,cy=py+ph/2;
  const dim=`${dw}×${dh}${rotated?' ↺':''}`;
  if(ph>fs*2.8&&pw>32){
    ctx.font=`bold ${fs}px 'Segoe UI',sans-serif`;
    ctx.fillStyle='rgba(255,255,255,.95)';
    ctx.fillText(fitText(ctx,name,pw-8),cx,cy-fs*0.75);
    ctx.font=`${Math.max(5.5,fs*0.82)}px 'Segoe UI',sans-serif`;
    ctx.fillStyle='rgba(255,255,255,.58)';
    ctx.fillText(fitText(ctx,dim,pw-8),cx,cy+fs*0.85);
  }else{
    ctx.font=`bold ${fs}px 'Segoe UI',sans-serif`;
    ctx.fillStyle='rgba(255,255,255,.92)';
    ctx.fillText(fitText(ctx,name,pw-6),cx,cy);
  }
  ctx.restore();
}

function fitText(ctx,text,maxW){
  if(!text) return '';
  if(ctx.measureText(text).width<=maxW) return text;
  while(text.length>1&&ctx.measureText(text+'…').width>maxW) text=text.slice(0,-1);
  return text.length>1?text+'…':text;
}

// ─── Drag & Drop + Rotation ───────────────────────────────────────────────────
const tip=document.getElementById('tip');
const showTip=(msg,x,y)=>{tip.textContent=msg;tip.style.left=(x+14)+'px';tip.style.top=(y+12)+'px';tip.style.display='block';};
const hideTip=()=>tip.style.display='none';

function setupDrag(canvas,sheet,panelW,panelH,kerf){
  let drag=null, hoverIdx=-1, flashTimer=null;

  const toP=(cx,cy)=>{const r=canvas.getBoundingClientRect();const sc=canvas._sc;return{px:(cx-r.left-CM)/sc,py:(cy-r.top-CM)/sc};};
  const canvasXY=(e)=>{const r=canvas.getBoundingClientRect();return{mx:e.clientX-r.left,my:e.clientY-r.top};};

  const hitPiece=(px,py)=>{
    for(let i=sheet.placements.length-1;i>=0;i--){
      const p=sheet.placements[i];
      if(px>=p.x&&px<p.x+p.w&&py>=p.y&&py<p.y+p.h) return i;
    }
    return -1;
  };
  const noOverlap=(idx,nx,ny)=>{
    const p=sheet.placements[idx];
    if(nx<0||ny<0||nx+p.w>sheet.W||ny+p.h>sheet.H) return false;
    return !sheet.placements.some((o,i)=>i!==idx&&nx<o.x+o.w&&nx+p.w>o.x&&ny<o.y+o.h&&ny+p.h>o.y);
  };

  // Try to rotate piece at idx 90°; flash red if impossible
  const rotatePiece=(idx)=>{
    const pl=sheet.placements[idx];
    const nw=pl.h, nh=pl.w; // swap dimensions
    const fits=noOverlap(idx,pl.x,pl.y)&&(pl.x+nw<=sheet.W)&&(pl.y+nh<=sheet.H)
      &&!sheet.placements.some((o,i)=>i!==idx&&pl.x<o.x+o.w&&pl.x+nw>o.x&&pl.y<o.y+o.h&&pl.y+nh>o.y);
    if(fits){
      pl.w=nw; pl.h=nh; pl.rotated=!pl.rotated;
      sheet._edited=true;
      drawPanel(canvas,sheet,panelW,panelH,kerf,null,hoverIdx);
    } else {
      // Flash red
      if(flashTimer) clearTimeout(flashTimer);
      drawPanel(canvas,sheet,panelW,panelH,kerf,null,-1,idx);
      flashTimer=setTimeout(()=>drawPanel(canvas,sheet,panelW,panelH,kerf,null,hoverIdx),380);
    }
  };

  // Right-click → rotate
  canvas.addEventListener('contextmenu',e=>{
    e.preventDefault();
    const{px,py}=toP(e.clientX,e.clientY);
    const idx=hitPiece(px,py);
    if(idx>=0) rotatePiece(idx);
  });

  canvas.addEventListener('mousedown',e=>{
    if(e.button!==0) return;
    const{mx,my}=canvasXY(e);
    const{px,py}=toP(e.clientX,e.clientY);
    // Click on rotate button?
    if(hoverIdx>=0&&isOverRotBtn(mx,my,sheet.placements[hoverIdx],canvas._sc,kerf)){
      rotatePiece(hoverIdx);
      e.preventDefault(); return;
    }
    const idx=hitPiece(px,py);
    if(idx<0) return;
    const pl=sheet.placements[idx];
    drag={idx,origX:pl.x,origY:pl.y,offX:px-pl.x,offY:py-pl.y,valid:true};
    canvas.style.cursor='grabbing'; e.preventDefault();
  });

  canvas.addEventListener('mousemove',e=>{
    const{px,py}=toP(e.clientX,e.clientY);
    const{mx,my}=canvasXY(e);
    if(drag){
      const pl=sheet.placements[drag.idx];
      const nx=Math.max(0,Math.min(sheet.W-pl.w,Math.round(px-drag.offX)));
      const ny=Math.max(0,Math.min(sheet.H-pl.h,Math.round(py-drag.offY)));
      pl.x=nx; pl.y=ny;
      drag.valid=noOverlap(drag.idx,nx,ny);
      drawPanel(canvas,sheet,panelW,panelH,kerf,drag,hoverIdx);
    } else {
      const newHover=hitPiece(px,py);
      if(newHover!==hoverIdx){
        hoverIdx=newHover;
        drawPanel(canvas,sheet,panelW,panelH,kerf,null,hoverIdx);
      }
      // Cursor
      if(hoverIdx>=0&&isOverRotBtn(mx,my,sheet.placements[hoverIdx],canvas._sc,kerf))
        canvas.style.cursor='pointer';
      else if(hoverIdx>=0)
        canvas.style.cursor='grab';
      else
        canvas.style.cursor='default';
      // Tooltip on free rect
      if(hoverIdx<0&&showOffcuts&&!sheet._edited){
        const frs=sheet.freeRects;
        const fr=(Array.isArray(frs)?frs:[]).find(r=>px>=r.x&&px<r.x+r.w&&py>=r.y&&py<r.y+r.h);
        if(fr) showTip(`${t('tipOffcut')} ${Math.round(fr.w-kerf)} × ${Math.round(fr.h-kerf)} mm`,e.clientX,e.clientY);
        else hideTip();
      } else hideTip();
    }
  });

  const end=()=>{
    if(!drag) return;
    if(!drag.valid){sheet.placements[drag.idx].x=drag.origX;sheet.placements[drag.idx].y=drag.origY;}
    else sheet._edited=true;
    drag=null; canvas.style.cursor='default';
    drawPanel(canvas,sheet,panelW,panelH,kerf,null,hoverIdx); hideTip();
  };
  canvas.addEventListener('mouseup',end);
  canvas.addEventListener('mouseleave',()=>{hoverIdx=-1;end();hideTip();});
}
